# Serves the built single-page app and proxies the API, so the browser only
# ever talks to one origin (no CORS needed).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Matches the backend's ingestion limit (AEGIS_MAX_INGEST_BYTES, 5 MiB).
    client_max_body_size 5m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    # The app loads only its own scripts and styles; no third-party origins.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The interactive API docs load Swagger UI from a CDN, so they cannot use
    # the strict policy above. add_header here replaces (not extends) the
    # server-level headers, so the other headers are repeated without CSP.
    location /docs {
        proxy_pass http://backend:8000;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }
    location /openapi.json { proxy_pass http://backend:8000; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
